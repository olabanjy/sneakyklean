<style>
body {
  margin: 0;
  background: #f6f6f6;
  font-family:'Avenir', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
}

.container {
  max-width: 520px;
  margin: 40px auto;
  background: #fff;
  border-radius: 10px;
  overflow: hidden;
}

/* Header */
.header {
  background: #000;
  padding: 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header img {
  width: 100px;
}

.header span {
  color: #fff;
  font-size: 13px;
}

/* Content */
.content {
  padding: 40px 30px;
}

/* Rating */
.rating-section {
  text-align: center;
}

.rating-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 20px;
}

/* Stars */
.stars {
  display: flex;
  justify-content: center;
  gap: 10px;
}

.stars span {
  font-size: 32px;
  cursor: pointer;
  color: #e5e5e5;
  transition: transform 0.15s ease, color 0.15s ease;
}

.stars span.active {
  color: #000;
  transform: scale(1.1);
}

/* Rating text */
#rating-text {
  margin-top: 12px;
  font-size: 13px;
  color: #666;
  min-height: 18px;
}

.divider {
  height: 1px;
  background: #eee;
  margin: 30px 0;
}

.footer {
  padding: 20px 30px;
  font-size: 12px;
  color: #9b9b9b; text-align: center;
}

<div class="container">

  <div class="header">
    <img src="https://res.cloudinary.com/dyueswnzk/image/upload/v1775666139/sneak_qb6xip.png">

  </div>

  <div class="content">

    <div class="rating-section">
      <div class="rating-title">Rate your experience</div>

      <div class="stars" id="stars">
        <span>★</span>
        <span>★</span>
        <span>★</span>
        <span>★</span>
        <span>★</span>
      </div>

      <div id="rating-text"></div>
    </div>

    </div>

</div>

<script>
// ===== Rating Logic =====

const stars = document.querySelectorAll("#stars span");
const ratingText = document.getElementById("rating-text");

let rating = 0;

// Highlight stars
function highlight(count) {
  stars.forEach((star, index) => {
    star.classList.toggle("active", index < count);
  });
}

// Events
stars.forEach((star, index) => {

  // Hover preview
  star.addEventListener("mouseenter", () => {
    highlight(index + 1);
  });

  // Reset on leave
  star.addEventListener("mouseleave", () => {
    highlight(rating);
  });

  // Click to select
  star.addEventListener("click", () => {
    rating = index + 1;
    highlight(rating);

    ratingText.textContent =
      `You rated ${rating} star${rating > 1 ? "s" : ""}`;

    console.log("Rating:", rating);
  });

});
</script>
