<script>const images = [

<script id="snkd-final-js">


const input = document.querySelector(".snkd-input");
const button = document.querySelector(".snkd-button");
const toggle = document.querySelector(".snkd-switch input");
const toast = document.getElementById("snkd-toast");

let isOtpStage = false;
let savedEmailTemp = "";

/* =========================
   🔔 TOAST FUNCTION
========================= */
function showToast(message = "OTP Sent") {
  toast.textContent = message;
  toast.classList.add("snkd-show");

  setTimeout(() => {
    toast.classList.remove("snkd-show");
  }, 2500);
}

/* =========================
   🔁 LOAD SAVED EMAIL
========================= */
window.addEventListener("DOMContentLoaded", () => {
  const savedEmail = localStorage.getItem("snkd-email");

  if (savedEmail) {
    input.value = savedEmail;
    toggle.checked = true;
  }
});

/* =========================
   📧 EMAIL VALIDATION
========================= */
function isValidEmail(email) {
  return /\S+@\S+\.\S+/.test(email);
}

/* =========================
   ✏️ RESET ERROR ON TYPE
========================= */
input.addEventListener("input", () => {
  input.style.borderColor = "";
});

/* =========================
   🔘 BUTTON CLICK
========================= */
button.addEventListener("click", () => {

  /* ===== STEP 1: EMAIL ===== */
  if (!isOtpStage) {
    const email = input.value.trim();

    if (!isValidEmail(email)) {
      input.style.borderColor = "red";
      input.focus();
      showToast("Enter a valid email");
      return;
    }

    if (toggle.checked) {
      localStorage.setItem("snkd-email", email);
    } else {
      localStorage.removeItem("snkd-email");
    }

    savedEmailTemp = email;

    input.value = "";
    input.placeholder = "Enter OTP";
    input.type = "text";
    input.focus();

    button.textContent = "Verify OTP";
    isOtpStage = true;

    showToast("OTP Sent");

    console.log("OTP sent to:", email);
  }

  /* ===== STEP 2: OTP ===== */
  else {
    const otp = input.value.trim();

    if (otp.length < 4) {
      input.style.borderColor = "red";
      showToast("Invalid OTP");
      return;
    }

    console.log("OTP entered:", otp);

    button.textContent = "Verifying...";
    button.style.background = "#2f80ed";
    button.disabled = true;

    setTimeout(() => {
      button.textContent = "Verified";
      showToast("Login Successful");

      input.disabled = true;
      toggle.disabled = true;

      // 👉 REDIRECT TO YOUR LIVE PAGE
      setTimeout(() => {
        window.location.href =
          "https://kolapo.com/sk/dash?email=" + encodeURIComponent(savedEmailTemp);
      }, 1000);

    }, 1200);
  }
});
</script>


<script>// =========================
// REVEAL ON SCROLL (SAFE)
// =========================
(function () {

  function initReveal() {
    const elements = document.querySelectorAll(".reveal-up");

    if (!elements.length) return;

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add("active");

          // OPTIONAL: animate only once
          observer.unobserve(entry.target);
        }
      });
    }, {
      threshold: 0.15 // trigger when 15% visible
    });

    elements.forEach(el => observer.observe(el));
  }

  document.addEventListener("DOMContentLoaded", initReveal);

})();</script>
