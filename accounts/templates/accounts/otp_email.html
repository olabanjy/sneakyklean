<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>OTP Verification</title>
</head>

<body style="margin:0; padding:0; background:#f6f6f6; font-family:'Avenir', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f6f6f6; padding:20px 0;">
<tr>
<td align="center">

<table width="520" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff; border-radius:6px; overflow:hidden;">

<!-- Header -->
<tr>
<td style="background:#000000; padding:36px 39px;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <!-- Logo -->
      <td align="left" valign="middle">
        <img 
          src="https://res.cloudinary.com/dyueswnzk/image/upload/v1775666139/sneak_qb6xip.png" 
          width="100" 
          style="display:block;">
      </td>
      <!-- Context -->
      <td align="right" valign="middle" style="color:#ffffff; font-size:14px; font-weight:800;">
        One-Time Password
      </td>
    </tr>
  </table>
</td>
</tr>

<!-- Body -->
<tr>
<td style="padding:40px 30px; text-align:left;">

<div style="font-size:22px; font-weight:600; color:#000; margin-bottom:10px;">
Verify your identity
</div>

<div style="font-size:14px; color:#6b6b6b; line-height:1.6; margin-bottom:30px;">
Use the code below to continue. Do not share this code with anyone.
</div>

<!-- OTP -->
<div style="
  font-size:48px;
  font-weight:900;
  letter-spacing:14px;
  color:#000000;
  margin:30px 0;
">
{{ otp_code }}
</div>

<!-- Divider -->
<div style="height:1px; background:#eeeeee; margin:30px 0;"></div>

<!-- Info -->
<div style="font-size:13px; color:#6b6b6b; line-height:1.6;">
This code expires in 5 minutes.  
If you didn't request this, you can safely ignore this email.
</div>

</td>
</tr>

<!-- Footer -->
<tr>
<td style="padding:20px 30px; font-size:12px; color:#9b9b9b; text-align:left;">
For your security, never share your verification code.
</td>
</tr>

</table>

</td>
</tr>
</table>

</body>
</html>
