<script>const images = [

<script id="snkd-final-js">

// Toast element
const toast = document.getElementById("snkd-toast");

/* =========================
   🔔 TOAST FUNCTION
========================= */
function showToast(message = "OTP Sent") {
  toast.textContent = message;
  toast.classList.add("snkd-show");

  setTimeout(() => {
    toast.classList.remove("snkd-show");
  }, 2500);
}

/* =========================
   📧 EMAIL VALIDATION
========================= */
function isValidEmail(email) {
  return /\S+@\S+\.\S+/.test(email);
}

/* =========================
   🔁 LOAD SAVED EMAIL ON PAGE LOAD
========================= */
window.addEventListener("DOMContentLoaded", () => {
  const savedEmail = localStorage.getItem("snkd-email");
  const emailInput = document.getElementById("email-input");
  const rememberCheckbox = document.getElementById("remember-checkbox");

  if (savedEmail && emailInput) {
    emailInput.value = savedEmail;
    if (rememberCheckbox) {
      rememberCheckbox.checked = true;
    }
  }
  
  // Initialize two-stage login
  initTwoStageLogin();
});

/* =========================
   🔘 TWO-STAGE LOGIN HANDLER
========================= */
function initTwoStageLogin() {
  const form = document.getElementById('login-form');
  const emailInput = document.getElementById('email-input');
  const otpInput = document.getElementById('otp-input');
  const submitButton = document.getElementById('submit-button');
  const rememberWrap = document.getElementById('remember-wrap');
  const rememberCheckbox = document.getElementById('remember-checkbox');

  if (!form || !emailInput || !otpInput || !submitButton) {
    console.error('Login form elements not found');
    return;
  }

  let isOtpStage = false;
  let savedEmail = '';

  // Handle form submission
  form.addEventListener('submit', async (e) => {
    e.preventDefault(); // Prevent default form submission
    
    if (!isOtpStage) {
      // STAGE 1: Send OTP
      const email = emailInput.value.trim();
      
      if (!isValidEmail(email)) {
        emailInput.style.borderColor = "red";
        emailInput.focus();
        showToast("Enter a valid email");
        return;
      }
      
      // Save email if remember is checked
      if (rememberCheckbox && rememberCheckbox.checked) {
        localStorage.setItem("snkd-email", email);
      } else {
        localStorage.removeItem("snkd-email");
      }
      
      savedEmail = email;
      
      // Send AJAX request to backend
      try {
        submitButton.textContent = "Sending...";
        submitButton.disabled = true;
        
        const formData = new FormData(form);
        const response = await fetch('/login/', {
          method: 'POST',
          body: formData,
          headers: {
            'X-Requested-With': 'XMLHttpRequest'
          }
        });
        
        const data = await response.json();
        
        if (data.success) {
          // Transform to OTP stage
          emailInput.style.display = 'none';
          otpInput.style.display = 'block';
          otpInput.focus();
          if (rememberWrap) rememberWrap.style.display = 'none';
          
          submitButton.textContent = "Verify OTP";
          submitButton.disabled = false;
          isOtpStage = true;
          
          showToast("OTP Sent");
        } else {
          showToast(data.message || "Failed to send OTP");
          submitButton.textContent = "Send OTP";
          submitButton.disabled = false;
        }
      } catch (error) {
        console.error('Error:', error);
        showToast("Error sending OTP");
        submitButton.textContent = "Send OTP";
        submitButton.disabled = false;
      }
      
    } else {
      // STAGE 2: Verify OTP
      const otp = otpInput.value.trim();
      
      if (otp.length !== 6) {
        otpInput.style.borderColor = "red";
        showToast("Enter 6-digit OTP");
        return;
      }
      
      // Submit OTP verification
      try {
        submitButton.textContent = "Verifying...";
        submitButton.disabled = true;
        
        const formData = new FormData();
        formData.append('csrfmiddlewaretoken', form.querySelector('[name=csrfmiddlewaretoken]').value);
        formData.append('otp_code', otp);
        
        const response = await fetch('/verify-otp/', {
          method: 'POST',
          body: formData,
          headers: {
            'X-Requested-With': 'XMLHttpRequest'
          }
        });
        
        const data = await response.json();
        
        if (data.success) {
          submitButton.textContent = "Verified";
          showToast("Login Successful");
          
          // Redirect to dashboard
          setTimeout(() => {
            window.location.href = data.redirect || '/dashboard/';
          }, 500);
        } else {
          showToast(data.message || "Invalid OTP");
          submitButton.textContent = "Verify OTP";
          submitButton.disabled = false;
          otpInput.value = '';
          otpInput.focus();
        }
      } catch (error) {
        console.error('Error:', error);
        showToast("Error verifying OTP");
        submitButton.textContent = "Verify OTP";
        submitButton.disabled = false;
      }
    }
  });
}
</script>


<script>// =========================
// REVEAL ON SCROLL (SAFE)
// =========================
(function () {

  function initReveal() {
    const elements = document.querySelectorAll(".reveal-up");

    if (!elements.length) return;

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add("active");

          // OPTIONAL: animate only once
          observer.unobserve(entry.target);
        }
      });
    }, {
      threshold: 0.15 // trigger when 15% visible
    });

    elements.forEach(el => observer.observe(el));
  }

  document.addEventListener("DOMContentLoaded", initReveal);

})();</script>
